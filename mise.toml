min_version = "2026.8.9"

[settings]
lockfile = true
lockfile_platforms = ["linux-x64", "linux-arm64", "macos-x64", "macos-arm64"]

[tool_config]
locked = true

[tools]
python = "3.13.15"
uv = "0.12.5"

[tasks."toolchain:sync"]
description = "Install the exact Python verification toolchain from uv.lock"
run = 'uv sync --project toolchain --frozen --python "$(mise which python)"'

[tasks."toolchain:check"]
description = "Prove that the pinned Warrant verifier is executable"
depends = ["toolchain:sync"]
run = '''
actual="$(uv run --project toolchain --frozen python -c 'from importlib.metadata import version; print(version("warrant-verify"))')"
expected="0.9.0"
if [ "$actual" != "$expected" ]; then
  echo "expected warrant-verify '$expected', got '$actual'" >&2
  exit 1
fi
uv run --project toolchain --frozen warrant --help >/dev/null
echo "warrant-verify $actual"
'''
