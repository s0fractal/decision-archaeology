min_version = "2026.8.9"

[settings]
lockfile = true
lockfile_platforms = ["linux-x64", "linux-arm64", "macos-x64", "macos-arm64"]

[tool_config]
locked = true

[tools]
python = "3.13.15"
uv = "0.12.5"

[tasks."toolchain:sync"]
description = "Install the exact Python verification toolchain from uv.lock"
run = 'uv sync --project toolchain --frozen --python "$(mise which python)"'

[tasks."toolchain:check"]
description = "Prove that the pinned Warrant verifier is executable"
depends = ["toolchain:sync"]
run = '''
actual="$(uv run --project toolchain --frozen python -c 'from importlib.metadata import version; print(version("warrant-verify"))')"
expected="0.9.0"
if [ "$actual" != "$expected" ]; then
  echo "expected warrant-verify '$expected', got '$actual'" >&2
  exit 1
fi
uv run --project toolchain --frozen warrant --help >/dev/null
echo "warrant-verify $actual"
'''

[tasks."case:barite"]
description = "Reproduce the barite calibration case from committed inputs"
depends = ["toolchain:sync"]
run = 'uv run --project toolchain --frozen python examples/barite-bid-rigging-2025/checks/check_case.py'

[tasks."case:barite:live"]
description = "Detect drift in the two official Prozorro source records"
run = 'python examples/barite-bid-rigging-2025/checks/refresh_sources.py --check'

[tasks."case:barite:exclusions"]
description = "Validate the case's recorded absences and keep its prose bound to them"
run = '''
python tools/validate_exclusions.py examples/barite-bid-rigging-2025
python tests/validate_exclusions_test.py
'''

[tasks."case:barite:acquisition"]
description = "Validate the committed retrievability and custody state of the case's sources"
run = '''
python tools/acquisition_state.py examples/barite-bid-rigging-2025
python tests/acquisition_state_test.py
'''

[tasks."case:barite:acquisition:live"]
description = "Re-check over the network who can still retrieve the case's sources"
run = 'python tools/acquisition_state.py examples/barite-bid-rigging-2025 --refresh'

[tasks."candidates:check"]
description = "Decide candidate admission from the record, and keep quarantine honest"
run = '''
python tools/admission_gate.py candidates/kherson-fortifications
python tests/admission_gate_test.py
'''

[tasks."needs:check"]
description = "Validate the immutable evidence-bound need template"
run = 'python tools/validate_need.py templates/need/v0.1.0'

[tasks."profile:sigma-money-add-eq"]
description = "Replay the case-derived Sigma money-add-equality profile vectors"
depends = ["toolchain:sync"]
run = 'uv run --project toolchain --frozen python profiles/sigma_money_add_eq_v0.py'

[tasks."profiles:check"]
description = "Enforce what every published profile must carry, and run each doc-derived rebuild"
depends = ["toolchain:sync"]
run = '''
uv run --project toolchain --frozen python tools/validate_profile.py
uv run --project toolchain --frozen python tests/validate_profile_test.py
'''

[tasks."adapters:warrant"]
description = "Carry the case's Sigma check into Warrant as a ski@v1 reason and verify the record"
depends = ["toolchain:sync"]
run = 'uv run --project toolchain --frozen python adapters/warrant_ski_reason_v0.py'

[tasks."outcomes:check"]
description = "Validate closed need outcomes and their immutable local artifacts"
run = '''
python tools/validate_need_outcome.py outcomes/*.json
python tests/validate_need_outcome_test.py
'''

[tasks.check]
description = "Run the repository offline reproducibility gate"
depends = ["toolchain:check", "case:barite", "case:barite:exclusions", "case:barite:acquisition", "candidates:check", "needs:check", "profile:sigma-money-add-eq", "profiles:check", "adapters:warrant", "outcomes:check"]
