name: Toolchain

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # Records that guard facts about the past read their own history:
          # outcome digests resolve at the revision they pin, and exclusions,
          # witnesses and gate requirements are checked against every revision
          # of their record. A single-commit checkout would make those guards
          # compare a record with itself.
          fetch-depth: 0

      - name: Install locked tools
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          version: 2026.8.9
          install: true
          cache: true

      - name: Verify toolchain and public cases
        run: mise run check
